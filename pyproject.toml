[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photomanager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "reverse_geocoder>=1.5",
    "scenedetect[opencv]>=0.6",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.17",
    "hdbscan>=0.8.33",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "piexif>=1.1", "hdbscan>=0.8.33"]

[project.scripts]
photomanager = "photomanager.cli:main"

[project.gui-scripts]
photomanager-organize-gui = "photomanager.gui_organize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
